name: Security Audit & Build Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: NPM Audit
      run: npm audit --audit-level=high || true

    - name: Verify Build
      run: npm run build

    - name: Check for .env committed
      run: |
        if [ -f ".env" ] || [ -f ".env.local" ] || [ -f ".env.production" ]; then
          echo "FAIL: Sensitive .env file found in repository!"
          exit 1
        fi
        echo "PASS: No sensitive .env file found."
